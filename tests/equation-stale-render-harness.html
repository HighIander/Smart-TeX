<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartTeX stale equation render harness</title>
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <div id="ide-redesign-panel-source-editor"><div class="cm-editor"></div></div>
  <output id="equation-stale-render-test-result">running</output>
  <script>
    let releaseFonts;
    globalThis.SmartTeXKatexFonts = {
      ready: new Promise((resolve) => { releaseFonts = resolve; })
    };
    const featureKey = "smarttex:features:v1";
    const popupKey = "smarttex:reference-popups:v1";
    globalThis.browser = {
      storage: {
        local: {
          async get() {
            return {
              [featureKey]: { equations: true, tables: true, figures: true },
              [popupKey]: { trigger: "cursor", environmentTrigger: "cursor" }
            };
          }
        },
        onChanged: { addListener() {} }
      },
      runtime: { async sendMessage() { return { ok: true }; } }
    };
    window.addEventListener("smarttex:citation-editor-request", (event) => {
      const request = JSON.parse(String(event.detail || "{}"));
      if (request.type !== "getCoordinates") return;
      window.dispatchEvent(new CustomEvent("smarttex:citation-editor-response", {
        detail: JSON.stringify({
          requestId: request.requestId,
          ok: true,
          screen: { pageX: 360, pageY: 220, lineHeight: 20 }
        })
      }));
    });
  </script>
  <script src="../vendor/katex/katex.min.js"></script>
  <script src="../latex-context.js"></script>
  <script src="../table-renderer.js"></script>
  <script src="../content.js"></script>
  <script>
    const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
    const sendState = (value, cursorIndex = value.length - 1) => {
      window.dispatchEvent(new CustomEvent("smarttex:editor-state", {
        detail: JSON.stringify({
          value,
          cursorIndex,
          selectionFrom: cursorIndex,
          selectionTo: cursorIndex,
          screen: { pageX: 360, pageY: 220, lineHeight: 20 },
          fileName: "main.tex",
          focused: true,
          editorKind: "harness"
        })
      }));
    };
    const waitFor = async (predicate, attempts = 150) => {
      for (let attempt = 0; attempt < attempts; attempt += 1) {
        const result = predicate();
        if (result) return result;
        await delay(20);
      }
      return null;
    };

    (async () => {
      sendState("$1$ outside", 10);
      await delay(40);
      document.querySelector(".smarttex-equation-output").textContent = "stale equation";
      sendState("$1$ outside", 1);
      const loadingPopup = await waitFor(() => {
        const candidate = document.querySelector("#smarttex-equation-preview:not([hidden])");
        const indicator = candidate?.querySelector(".smarttex-preview-loading-indicator");
        const outputIsEmpty = !candidate?.querySelector(".smarttex-equation-output")?.textContent;
        return candidate?.getAttribute("aria-busy") === "true" &&
          indicator && !indicator.hidden && outputIsEmpty
          ? candidate
          : null;
      }, 10);
      sendState("$12$");
      await delay(40);
      releaseFonts();
      const popup = await waitFor(() => {
        const candidate = document.querySelector("#smarttex-equation-preview:not([hidden])");
        return candidate?.querySelector(".katex")?.textContent?.includes("12")
          ? candidate
          : null;
      });
      const passed = Boolean(loadingPopup && popup && popup === loadingPopup);
      document.documentElement.dataset.equationStaleRenderTest = passed ? "passed" : "failed";
      document.querySelector("#equation-stale-render-test-result").textContent =
        passed ? "passed" : "popup did not open immediately or retain render ownership";
    })().catch((error) => {
      document.documentElement.dataset.equationStaleRenderTest = "failed";
      document.querySelector("#equation-stale-render-test-result").textContent = error.message;
    });
  </script>
</body>
</html>
