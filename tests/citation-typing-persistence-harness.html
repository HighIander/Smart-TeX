<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartTeX citation typing persistence harness</title>
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <output id="citation-typing-persistence-test-result">running</output>
  <script>
    globalThis.browser = {
      storage: {
        local: {
          async get(key) {
            return {
              [key]: {
                parsedAt: Date.now(),
                files: ["refs.bib"],
                records: [{
                  key: "Kluge2024",
                  title: "Cached citation",
                  authors: [{ family: "Kluge", given: "Thomas" }],
                  year: "2024",
                  journal: "Test Journal"
                }]
              }
            };
          },
          async set() {}
        },
        onChanged: { addListener() {} }
      }
    };
    window.addEventListener("smarttex:citation-editor-request", (event) => {
      const request = JSON.parse(String(event.detail || "{}"));
      const response = { requestId: request.requestId, ok: true };
      if (request.type === "getCoordinates") {
        response.screen = { pageX: 320, pageY: 210, lineHeight: 20 };
      } else if (request.type === "setCitationAutocompleteActive") {
        response.active = request.active === true;
      }
      window.dispatchEvent(new CustomEvent("smarttex:citation-editor-response", {
        detail: JSON.stringify(response)
      }));
    });
  </script>
  <script src="../bibtex-parser.js"></script>
  <script src="../latex-context.js"></script>
  <script src="../citation-autocomplete.js"></script>
  <script>
    const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
    const waitFor = async (predicate, attempts = 150) => {
      for (let attempt = 0; attempt < attempts; attempt += 1) {
        const result = predicate();
        if (result) return result;
        await delay(20);
      }
      return null;
    };
    const sendState = (fragment) => {
      const value = `Text \\cite{${fragment}}`;
      const cursorIndex = value.length - 1;
      window.dispatchEvent(new CustomEvent("smarttex:editor-state", {
        detail: JSON.stringify({
          value,
          cursorIndex,
          selectionFrom: cursorIndex,
          selectionTo: cursorIndex,
          screen: { pageX: 320, pageY: 210, lineHeight: 20 },
          fileName: "main.tex",
          focused: true,
          editorKind: "harness"
        })
      }));
    };

    (async () => {
      sendState("K");
      const popup = await waitFor(() => {
        const candidate = document.querySelector("#smarttex-citation-popup:not([hidden])");
        return candidate?.querySelector(".smarttex-citation-query")?.textContent ===
          "Citations matching “K”" ? candidate : null;
      });
      document.dispatchEvent(new InputEvent("beforeinput", {
        bubbles: true,
        inputType: "insertText",
        data: "l"
      }));
      sendState("Kl");
      await waitFor(() => popup?.querySelector(".smarttex-citation-query")?.textContent ===
        "Citations matching “Kl”");
      document.dispatchEvent(new InputEvent("input", {
        bubbles: true,
        inputType: "insertText",
        data: "l"
      }));
      window.dispatchEvent(new CustomEvent("smarttex:editor-scroll-state", {
        detail: { active: true, reason: "typing-auto-scroll" }
      }));
      const persistencePassed = Boolean(
        popup &&
        document.querySelector("#smarttex-citation-popup") === popup &&
        !popup.hidden &&
        popup.querySelector(".smarttex-citation-query")?.textContent ===
          "Citations matching “Kl”"
      );
      const partialItem = popup?.querySelector(
        ".smarttex-citation-item.smarttex-citation-selected"
      );
      const partialBackground = partialItem
        ? getComputedStyle(partialItem).backgroundColor
        : "";
      const partialKeyColor = partialItem
        ? getComputedStyle(partialItem.querySelector(".smarttex-citation-key")).color
        : "";
      const partialIsGray = Boolean(
        partialItem &&
        !partialItem.classList.contains("smarttex-citation-exact") &&
        getComputedStyle(partialItem).boxShadow === "none"
      );

      sendState("Kluge2024");
      const exactItem = await waitFor(() => popup?.querySelector(
        ".smarttex-citation-item.smarttex-citation-exact"
      ));
      const exactIsBlue = Boolean(
        exactItem &&
        getComputedStyle(exactItem).backgroundColor !== partialBackground &&
        getComputedStyle(exactItem.querySelector(".smarttex-citation-key")).color !== partialKeyColor
      );
      const passed = persistencePassed && partialIsGray && exactIsBlue;
      document.documentElement.dataset.citationTypingPersistenceTest =
        passed ? "passed" : "failed";
      document.querySelector("#citation-typing-persistence-test-result").textContent =
        passed ? "passed" : "failed";
    })().catch((error) => {
      document.documentElement.dataset.citationTypingPersistenceTest = "failed";
      document.querySelector("#citation-typing-persistence-test-result").textContent = error.message;
    });
  </script>
</body>
</html>
