<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartTeX comment emoji and reaction harness</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; color: #172033; background: #eef2f7; font-family: system-ui, sans-serif; }
    #ide-redesign-panel-source-editor { flex: 1 1 auto; min-width: 0; background: #fff; }
    #ide-redesign-panel-source-editor .cm-editor { height: 100%; padding: 24px; box-sizing: border-box; }
    #ide-redesign-panel-pdf { flex: 0 0 38%; background: #e8edf4; }
    #result { position: fixed; z-index: 2147483647; right: 10px; bottom: 10px; padding: 6px 9px; border-radius: 6px; color: #fff; background: #172033; font: 12px/1.3 monospace; }
  </style>
</head>
<body>
  <section id="ide-redesign-panel-source-editor"><div class="cm-editor">Mock LaTeX editor</div></section>
  <section id="ide-redesign-panel-pdf">Mock PDF preview</section>
  <output id="result">running…</output>

  <script>
    (() => {
      const storageValues = {
        "smarttex:comment-author-id:v1": "author-alice",
        "smarttex:comment-profile:v1": { name: "Alice", color: "#268bd2" }
      };
      const storageListeners = [];
      window.browser = {
        storage: {
          local: {
            async get(key) {
              if (typeof key === "string") return { [key]: storageValues[key] };
              return { ...storageValues };
            },
            async set(values) { Object.assign(storageValues, values || {}); },
            async remove(key) { delete storageValues[key]; }
          },
          onChanged: { addListener(listener) { storageListeners.push(listener); } }
        }
      };
      window.SmartTeXPageContext = { isDocumentPage: () => true };
      window.SmartTeXCommentProfile = {
        KEY: "smarttex:comment-profile:v1",
        COLORS: ["#268bd2"],
        normalize(value) {
          return {
            name: String(value?.name || "Alice"),
            color: String(value?.color || "#268bd2")
          };
        },
        async ensure() { return { name: "Alice", color: "#268bd2" }; }
      };
      window.__smartTeXReviewState = { tracking: false, markupMode: "markup", totalChangeCount: 0, changes: [] };

      const baseThread = {
        id: "thread-1",
        fileName: "main.tex",
        start: 1,
        end: 2,
        quote: "b",
        before: "a",
        after: "c",
        color: "#268bd2",
        authorName: "Alice",
        authorId: "author-alice",
        createdAt: 100,
        updatedAt: 100,
        deletedAt: 0,
        resolved: false,
        resolvedAt: 0,
        resolvedUpdatedAt: 0,
        comments: {
          "comment-1": {
            id: "comment-1",
            authorName: "Alice",
            authorColor: "#268bd2",
            authorId: "author-alice",
            text: "🎉",
            reactions: {},
            createdAt: 100,
            updatedAt: 100,
            deletedAt: 0
          }
        }
      };
      let metadata = { schemaVersion: 2, updatedAt: 100, threads: { "thread-1": baseThread }, marks: {} };
      window.__commentHarness = { storageValues, baseThread, get metadata() { return metadata; } };

      window.addEventListener("smarttex:citation-editor-request", (event) => {
        const request = JSON.parse(String(event.detail || "{}"));
        let response = { requestId: request.requestId, ok: true };
        if (request.type === "getState") {
          response.state = { fileName: "main.tex", value: "abc", cursorIndex: 1, selectionStart: 1, selectionEnd: 1 };
        } else if (request.type === "probeProjectMetadataFile") {
          response.probe = { exists: true, token: `present:${metadata.updatedAt}` };
        } else if (request.type === "readProjectMetadataFile") {
          response.file = { exists: true, value: JSON.stringify(metadata), fileName: ".smarttex-comments.json" };
        } else if (request.type === "writeProjectMetadataFile") {
          metadata = JSON.parse(String(request.text || "{}"));
          response.result = { ok: true, fileId: "metadata-1", entityType: "file" };
        }
        setTimeout(() => window.dispatchEvent(new CustomEvent("smarttex:citation-editor-response", {
          detail: JSON.stringify(response)
        })), 0);
      });
    })();
  </script>
  <script src="../comments.js"></script>
  <script>
    (() => {
      const waitFor = async (check, timeout = 7000) => {
        const start = performance.now();
        while (performance.now() - start < timeout) {
          const value = check();
          if (value) return value;
          await new Promise((resolve) => setTimeout(resolve, 25));
        }
        throw new Error("Timed out waiting for comment UI");
      };
      const click = (element) => element.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));

      window.runCommentEmojiReactionHarness = async () => {
        const result = document.querySelector("#result");
        try {
          await waitFor(() => window.__smartTeXCommentsInitializationActive === false);
          let pane = document.querySelector("#smarttex-comments-pane");
          if (!pane || pane.hidden) {
            window.dispatchEvent(new CustomEvent("smarttex:comments-toggle-pane"));
          }
          pane = await waitFor(() => {
            const candidate = document.querySelector("#smarttex-comments-pane");
            return candidate && !candidate.hidden ? candidate : null;
          });

          const emojiOnly = await waitFor(() => pane.querySelector(".smarttex-comment-text-emoji-only"));
          const baseSize = Number.parseFloat(getComputedStyle(pane).fontSize);
          const emojiSize = Number.parseFloat(getComputedStyle(emojiOnly).fontSize);
          const initialSmiley = pane.querySelector(".smarttex-comment-reaction-add:not(.smarttex-comment-reaction-add-plus)");

          click(pane.querySelector(".smarttex-comment-reply-button"));
          const replyTextarea = await waitFor(() => pane.querySelector(".smarttex-comment-reply-editor textarea"));
          replyTextarea.value = "Hi ";
          replyTextarea.setSelectionRange(3, 3);
          replyTextarea.dispatchEvent(new Event("input", { bubbles: true }));
          click(pane.querySelector(".smarttex-comment-reply-editor .smarttex-comment-emoji-trigger"));
          const inputPicker = await waitFor(() => {
            const candidate = document.querySelector("#smarttex-comment-emoji-picker");
            return candidate && !candidate.hidden ? candidate : null;
          });
          click([...inputPicker.querySelectorAll(".smarttex-comment-emoji-option")].find((button) => button.dataset.emoji === "😀"));
          const insertedAtCaret = replyTextarea.value === "Hi 😀";
          click(pane.querySelector(".smarttex-comment-reply-editor button:not(.smarttex-comment-emoji-trigger):not(.smarttex-comment-primary)"));

          click(initialSmiley);
          const reactionPicker = await waitFor(() => {
            const candidate = document.querySelector("#smarttex-comment-emoji-picker");
            return candidate && !candidate.hidden ? candidate : null;
          });
          click([...reactionPicker.querySelectorAll(".smarttex-comment-emoji-option")].find((button) => button.dataset.emoji === "👍"));
          let reaction = await waitFor(() => pane.querySelector(".smarttex-comment-reaction"));
          const localReaction = reaction.querySelector(".smarttex-comment-reaction-count")?.textContent === "1";
          const plusAfterReaction = Boolean(pane.querySelector(".smarttex-comment-reaction-add-plus"));

          const remoteThread = structuredClone(window.__commentHarness.baseThread);
          remoteThread.updatedAt = Date.now() + 1000;
          remoteThread.comments["comment-1"].reactions = {
            "👍": {
              "author-bob": {
                actorKey: "author-bob",
                authorId: "author-bob",
                authorName: "Bob",
                authorColor: "#d97706",
                active: true,
                updatedAt: Date.now() + 1000
              }
            }
          };
          window.dispatchEvent(new CustomEvent("smarttex:collaboration-signal", {
            detail: JSON.stringify({
              kind: "comments-live",
              payload: { data: { schemaVersion: 2, updatedAt: remoteThread.updatedAt, threads: { "thread-1": remoteThread }, marks: {} } }
            })
          }));
          reaction = await waitFor(() => {
            const candidate = pane.querySelector(".smarttex-comment-reaction");
            return candidate?.querySelector(".smarttex-comment-reaction-count")?.textContent === "2" ? candidate : null;
          });
          const names = [...reaction.querySelectorAll(".smarttex-comment-reaction-tooltip > span")].map((item) => item.textContent);

          const checks = {
            colorEmojiFontFirst: getComputedStyle(pane).fontFamily.trim().startsWith('"Segoe UI Emoji"') || getComputedStyle(pane).fontFamily.trim().startsWith("Segoe UI Emoji"),
            emojiOnlyTripleSize: Math.abs(emojiSize - baseSize * 3) < 0.2,
            initialSmiley: Boolean(initialSmiley),
            inputPickerOpened: Boolean(inputPicker),
            insertedAtCaret,
            localReaction,
            plusAfterReaction,
            concurrentCount: reaction.querySelector(".smarttex-comment-reaction-count")?.textContent === "2",
            synchronizedNames: names.includes("Alice") && names.includes("Bob")
          };
          const passed = Object.values(checks).every(Boolean);
          result.value = passed ? "PASS" : `FAIL ${JSON.stringify(checks)}`;
          result.textContent = result.value;
          window.__commentEmojiReactionHarnessResult = { passed, checks };
          return window.__commentEmojiReactionHarnessResult;
        } catch (error) {
          result.value = `ERROR ${error.message}`;
          result.textContent = result.value;
          window.__commentEmojiReactionHarnessResult = { passed: false, error: error.message };
          return window.__commentEmojiReactionHarnessResult;
        }
      };
    })();
  </script>
</body>
</html>
